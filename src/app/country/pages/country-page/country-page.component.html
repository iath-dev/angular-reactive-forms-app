<h1 class="text-3xl text-primary my-2">Selectores anidados</h1>

<form [formGroup]="form" (submit)="submit()">
  <!-- Region -->
  <div>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Continente:</legend>
      <select
        formControlName="region"
        class="select select-primary select-md"
        placeholder="-- Seleccione Continente --"
      >
        <option value="">-- Seleccione Continente --</option>

        @for (region of regions; track region) {
        <option [value]="region">
          {{ region }}
        </option>
        }
      </select>
    </fieldset>
  </div>

  <!-- Countries -->

  <div>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">País:</legend>
      <select
        formControlName="country"
        class="select select-primary select-md"
        placeholder="-- Seleccione País --"
      >
        <option value="">-- Seleccione País --</option>

        @for (country of countries(); track country.cca3) {
        <option [value]="country.cca3">
          {{ country.name.common }}
        </option>
        }
      </select>
    </fieldset>
  </div>

  <!-- Countries -->

  <div>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Fronteras:</legend>
      <select
        formControlName="border"
        class="select select-primary select-md"
        placeholder="-- Seleccione frontera --"
      >
        <option value="">-- Seleccione la frontera --</option>

        @for (country of borders(); track country.cca3) {
        <option [value]="country.cca3">
          {{ country.name.common }}
        </option>
        }
      </select>
    </fieldset>
  </div>
</form>

<div class="card mt-2">
  <div class="card-title">
    <h3 class="text-secondary text-xl">Formulario</h3>
  </div>
  <div class="card-body">
    <div class="mockup-code">
      <pre>
        <code>
          {{ form.value | json }}
        </code>
      </pre>
      <pre class="text-accent">is form valid: {{ form.valid }}</pre>
    </div>
  </div>
</div>
